# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi câu hỏi làm rõ khi thiếu thông tin (mã máy, mã nhân viên, môi trường) hoặc xin xác nhận trước khi thực hiện hành động ghi (như tạo ticket)."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi hoặc nội dung tóm tắt cần xác nhận"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "text khi thiếu mã máy/mã nhân viên; yes_no khi xin xác nhận tạo ticket; choice khi cần người dùng chọn môi trường"}
        options: {type: array, default: [], items: {type: string}, description: "Danh sách lựa chọn khi response_type là choice, ví dụ: ['production', 'staging']"}
      required: [question]

  - name: search_kb
    description: "Tìm hướng dẫn hỗ trợ kỹ thuật trong kho tri thức nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn: 'email' cho Outlook/webmail/hộp thư; 'vpn' cho VPN; 'wifi' cho mạng Wi-Fi; 'account' cho tài khoản/mật khẩu/MFA; 'hardware' cho phần cứng; 'software' cho phần mềm"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái dịch vụ dùng chung (VPN, email, SSO, Wi-Fi...). Chỉ hỗ trợ môi trường production hoặc staging."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường: chỉ chấp nhận production hoặc staging. Nếu người dùng đề cập môi trường mơ hồ như 'demo', 'lab', bắt buộc gọi clarify với response_type='choice' và options=['production', 'staging']"}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra thông tin và chẩn đoán thiết bị theo mã tài sản (Asset ID). Không dùng cho mã nhân viên."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản hợp lệ (ví dụ LT-204, DT-031). Bắt buộc phải là mã cụ thể, không được là danh từ chung như 'laptop'. Nếu thiếu phải gọi clarify."}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Phân hệ kiểm tra: 'vpn' cho lỗi VPN hoặc certificate VPN; 'network' cho Wi-Fi/mạng; 'security' cho bảo mật/antivirus; 'hardware' cho phần cứng/pin/disk; 'all' khi kiểm tra tổng thể"}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu người dùng trong danh bạ hỗ trợ và các thiết bị được cấp. Đã bao gồm thông tin thiết bị được cấp, không gọi thêm inspect_device."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên hợp lệ (ví dụ EMP-1003). Không dùng tên phòng ban như 'Sales' hoặc placeholder. Nếu thiếu phải gọi clarify."}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo kỹ thuật hoặc handoff. Không dùng để thu thập lại dữ liệu."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: search_security_advisories
    description: "Tìm cảnh báo bảo mật/CVE công khai mới nhất cho sản phẩm hoặc thành phần phần mềm/firmware. Chỉ truyền hãng, sản phẩm, component và phiên bản công khai; không truyền asset ID, employee ID, hostname, serial, IP, log, credential hoặc nội dung ticket. Chỉ dùng khi người dùng hỏi lỗ hổng, CVE, security advisory hoặc phiên bản bị ảnh hưởng; kết quả web là bằng chứng tham khảo, không tự cho phép cập nhật hay tạo ticket."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng công khai, ví dụ Lenovo hoặc Microsoft"}
        product: {type: string, description: "Tên sản phẩm/model công khai, ví dụ ThinkPad T14 Gen 4"}
        component: {type: string, enum: [bios, firmware, driver, operating_system, application, all], default: "all", description: "Thành phần công khai cần kiểm tra"}
        version: {type: string, default: "", description: "Phiên bản công khai nếu người dùng đã cung cấp, ví dụ 1.35; không truyền serial, asset ID hay hostname"}
        max_results: {type: integer, default: 3, description: "Số kết quả, từ 1 đến 5"}
      required: [manufacturer, product]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ. CHỈ GỌI KHI NGƯỜI DÙNG ĐÃ XÁC NHẬN RÕ RÀNG Ở LƯỢT TRƯỚC (confirmed=true). Tuyệt đối không gọi create_ticket khi chưa có xác nhận (kể cả confirmed=false); khi cần hỏi xác nhận, gọi clarify(response_type='yes_no')."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận rõ ràng"}
      required: [summary]
